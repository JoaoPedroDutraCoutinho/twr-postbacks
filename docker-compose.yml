services:
  postgres:
    image: postgres:16-alpine
    container_name: twr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: twr_postbacks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d twr_postbacks"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Visualizacao de traces (OpenTelemetry). UI em http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: twr_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  postgres_data:
