$kind: http-request
name: GET /reports/sales?group_by=product - Agrupado por Produto
url: "{{baseUrl}}/reports/sales?group_by=product"
method: GET
queryParams:
  group_by: product
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code é 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Retorna array groups", function () {
          var json = pm.response.json();
          pm.expect(json.groups).to.be.an("array");
      });
    language: text/javascript
order: 7000
