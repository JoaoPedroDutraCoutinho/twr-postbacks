$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code é 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Serviço e banco operacionais", function () {
          var json = pm.response.json();
          pm.expect(json.status).to.eql("ok");
          pm.expect(json.database).to.eql("connected");
      });
    language: text/javascript
order: 1000
