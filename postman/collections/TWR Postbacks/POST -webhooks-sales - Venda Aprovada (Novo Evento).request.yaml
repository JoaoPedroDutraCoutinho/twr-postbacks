$kind: http-request
name: POST /webhooks/sales - Venda Aprovada (Novo Evento)
url: "{{baseUrl}}/webhooks/sales"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "platform": "kiwify",
      "event_id": "{{eventId}}",
      "event_type": "sale.approved",
      "order_id": "ord_1001",
      "product": {
        "id": "prod_saas",
        "name": "Plano Pro TWR"
      },
      "currency": "BRL",
      "amount_cents": 29700,
      "customer": {
        "email": "comprador@twrplay.com",
        "name": "João da Silva"
      }
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set('eventId', 'evt_' + Date.now());
      const crypto = require('crypto-js');
      const secret = pm.environment.get('webhookSecret');
      const body = pm.variables.replaceIn(pm.request.body.toString());
      const signature = crypto.HmacSHA256(body, secret).toString(crypto.enc.Hex);
      pm.request.headers.upsert({key: 'X-Signature', value: signature});
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code é 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Status created e eventId correto", function () {
          var json = pm.response.json();
          pm.expect(json.status).to.eql("created");
          pm.expect(json.eventId).to.eql(pm.variables.get("eventId"));
      });
    language: text/javascript
order: 2000
